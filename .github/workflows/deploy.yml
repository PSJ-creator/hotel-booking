name: Build and Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Secret 파일 생성
      - name: Make application-secret.properties
        run: |
          mkdir -p ./src/main/resources
          cat << 'EOF' > ./src/main/resources/application-secret.properties
          ${{ secrets.SECRET }}
          EOF

      # Gradle 빌드
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      # 빌드된 JAR 파일을 오라클 서버로 전송 (SCP)
      - name: Transfer JAR to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          source: "build/libs/*.jar"
          target: "/home/ubuntu/app"
          strip_components: 2

      # 서버 접속 후 기존 앱 종료 및 새 JAR 실행 (SSH)
      - name: Run Application on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          script: |
            cd /home/ubuntu/app

            # 1. 8080 포트를 점유 중인 프로세스만 정확히 찾아서 종료 (자기 자신 종료 방지)
            CURRENT_PID=$(lsof -ti:8080 || true)
            if [ -n "$CURRENT_PID" ]; then
              echo "기존 애플리케이션 종료 (PID: $CURRENT_PID)"
              kill -15 $CURRENT_PID || true
              sleep 5
            fi

            # 혹시 종료되지 않고 남아있다면 강제 종료
            REMAINING_PID=$(lsof -ti:8080 || true)
            if [ -n "$REMAINING_PID" ]; then
              echo "강제 종료 진행 (PID: $REMAINING_PID)"
              kill -9 $REMAINING_PID || true
              sleep 2
            fi

            # 2. 가장 최근에 생성된 단일 JAR 파일 이름 가져오기
            JAR_NAME=$(ls -t *.jar | grep -v 'plain' | head -n 1)
            echo "실행할 JAR: $JAR_NAME"

            # 3. 새 JAR 백그라운드 실행 (disown으로 세션 완전 분리)
            nohup java -jar "$JAR_NAME" > app.log 2>&1 &
            sleep 3

            echo "애플리케이션 배포 및 실행 완료"