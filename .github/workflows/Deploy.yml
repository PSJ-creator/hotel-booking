name: Build and Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # v4 -> v5 업데이트
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # 리액트 빌드를 위한 Node.js 설치
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Secret 파일 생성
      - name: Make application-secret.properties
        run: |
          mkdir -p ./src/main/resources
          cat << 'EOF' > ./src/main/resources/application-secret.properties
          ${{ secrets.SECRET }}
          EOF
          echo "app.domain=${{ secrets.APP_DOMAIN }}" >> ./src/main/resources/application-secret.properties
          echo "kakao.redirect.uri=http://your-server-ip:8080/api/v1/auth/kakao/callback" >> ./src/main/resources/application-secret.properties

      # 리액트 의존성 설치 (CI 환경 권장: npm ci)
      - name: Install Frontend Dependencies
        working-directory: WebContent/hoteol-booking-app
        run: npm ci || npm install

      # 💡 [추가할 부분] 리액트 빌드용 .env 파일 생성
      - name: Make React .env file
        working-directory: WebContent/hoteol-booking-app
        run: |
          echo "VITE_KAKAO_CLIENT_ID=${{ secrets.VITE_KAKAO_CLIENT_ID }}" > .env

      # Gradle 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Gradle 빌드 (리액트 번들링 및 정적 리소스 복사 포함)
      - name: Build with Gradle
        run: ./gradlew clean build -x test

      # 빌드된 JAR 파일을 오라클 서버로 전송 (SCP)
      - name: Transfer JAR to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          source: "build/libs/*.jar"
          target: "/home/ubuntu/app"
          strip_components: 2

      # 서버 원격 접속 후 안전하게 재실행 (SSH)
      - name: Run Application on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          script: |
            cd /home/ubuntu/app

            # 1. 8080 포트를 점유 중인 프로세스만 정확히 종료
            CURRENT_PID=$(lsof -ti:8080 || true)
            if [ -n "$CURRENT_PID" ]; then
              echo "기존 애플리케이션 종료 (PID: $CURRENT_PID)"
              kill -15 $CURRENT_PID || true
              sleep 5
            fi

            # 혹시 종료되지 않고 남아있다면 강제 종료
            REMAINING_PID=$(lsof -ti:8080 || true)
            if [ -n "$REMAINING_PID" ]; then
              echo "강제 종료 진행 (PID: $REMAINING_PID)"
              kill -9 $REMAINING_PID || true
              sleep 2
            fi

            # 2. 실행 가능한 최신 JAR 파일 탐색 (plain 제외)
            JAR_NAME=$(ls -t *.jar | grep -v 'plain' | head -n 1)
            echo "실행할 JAR: $JAR_NAME"

            # 3. 새 JAR 백그라운드 실행
            nohup java -jar "$JAR_NAME" > app.log 2>&1 &
            sleep 3

            echo "애플리케이션 배포 및 실행 완료"