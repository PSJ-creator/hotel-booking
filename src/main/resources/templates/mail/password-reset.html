<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body style="margin: 0; padding: 0; background-color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
<table width="100%" border="0" cellspacing="0" cellpadding="0" style="background-color: #f1f5f9; padding: 40px 0;">
    <tr>
        <td align="center">
            <table width="520" border="0" cellspacing="0" cellpadding="0" style="background-color: #ffffff; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.06); border: 1px solid #e2e8f0;">
                <!-- 헤더 영역 -->
                <tr>
                    <td style="background-color: #123f4d; padding: 32px 40px; text-align: center;">
                        <h1 style="color: #ffffff; margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.5px;">
                            제주 야호
                        </h1>
                        <p style="color: #94a3b8; margin: 6px 0 0 0; font-size: 13px;">
                            JEJU YA-HO 인증 센터
                        </p>
                    </td>
                </tr>

                <!-- 본문 영역 -->
                <tr>
                    <td style="padding: 40px 40px 32px 40px;">
                        <h2 style="color: #0f172a; margin: 0 0 12px 0; font-size: 18px; font-weight: 700;">
                            비밀번호 재설정 인증번호
                        </h2>
                        <p style="color: #475569; font-size: 14px; line-height: 1.6; margin: 0 0 28px 0;">
                            안녕하세요. 제주 야호 서비스를 이용해 주셔서 감사합니다.<br>
                            비밀번호 변경을 완료하기 위해 아래 6자리 인증번호를 인증창에 입력해 주세요.
                        </p>

                        <!-- 인증 코드 박스 -->
                        <table width="100%" border="0" cellspacing="0" cellpadding="0" style="background-color: #f8fafc; border-radius: 12px; border: 1px dashed #0f766e; margin-bottom: 28px;">
                            <tr>
                                <td align="center" style="padding: 24px;">
                                        <span style="font-size: 32px; font-weight: 800; letter-spacing: 8px; color: #0f766e; font-family: monospace;"
                                              th:text="${code}">
                                            123456
                                        </span>
                                </td>
                            </tr>
                        </table>

                        <p style="color: #ef4444; font-size: 13px; margin: 0 0 8px 0; font-weight: 600;">
                            ⏱ 인증번호 유효 시간: 3분
                        </p>
                        <p style="color: #94a3b8; font-size: 12px; line-height: 1.5; margin: 0;">
                            본인이 요청하지 않은 경우 해당 메일을 즉시 삭제해 주시고 계정 보안을 점검해 주세요.
                        </p>
                    </td>
                </tr>

                <!-- 푸터 영역 -->
                <tr>
                    <td style="background-color: #f8fafc; padding: 20px 40px; text-align: center; border-top: 1px solid #f1f5f9;">
                        <p style="color: #94a3b8; font-size: 11px; margin: 0;">
                            © 2026 JEJU YA-HO. All rights reserved.
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
