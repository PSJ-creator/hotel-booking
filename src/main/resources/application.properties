# ==========================================
# Secret 프로파일 포함 (application-secret.properties 연동)
# ==========================================
spring.profiles.include=secret

# 1. Oracle JDBC Full URL + 맨 끝에 전자지갑 경로(TNS_ADMIN) 직접 결합
spring.datasource.url=jdbc:oracle:thin:@(description=(retry_count=20)(retry_delay=3)(address=(protocol=tcps)(port=1522)(host=adb.ap-osaka-1.oraclecloud.com))(connect_data=(service_name=g60b0873abd734d_hotelbookingservice_medium.adb.oraclecloud.com))(security=(ssl_server_dn_match=yes)))?TNS_ADMIN=/Users/munhee/dev/project/hotel-booking/src/main/resources/wallet

# 2. 계정 정보 (비밀번호는 application-secret.properties 에서 주입)
spring.datasource.username=ADMIN
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# 3. JPA / Hibernate 방언 및 콘솔 설정
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 4. JWT 만료 시간 (비밀키는 application-secret.properties 에서 주입)
jwt.expiration=86400000

# 5. 카카오 로그인 Redirect URI (REST API 키는 application-secret.properties 에서 주입)
kakao.redirect.uri=http://localhost:8080/api/v1/auth/kakao/callback

# 6. 이메일 전송 공통 설정 (계정 및 앱 비밀번호는 application-secret.properties 에서 주입)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

